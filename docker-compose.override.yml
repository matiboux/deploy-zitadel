# Services definition override for development

services:

  # Database
  db:
    # Extend
    extends:
      file: docker-compose-db.yml
      service: db
    # Deploy override
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-postgres_password}

  # Zitadel Init
  zitadel-init:
    # Deploy override
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Zitadel configuration override
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNALDOMAIN:-zitadel-127.0.0.1.sslip.io}
      # Database configuration override
      ZITADEL_DATABASE_POSTGRES_HOST: ${DB_HOST:-db}
      ZITADEL_DATABASE_POSTGRES_PORT: ${DB_PORT:-5432}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: ${DB_SSL_MODE:-disable}
      # Database init configuration
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${DB_ADMIN_USER:-postgres}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-postgres_password}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: ${DB_ADMIN_SSL_MODE:-disable}

  # Zitadel
  zitadel:
    # Deploy override
    command:
      - start-from-setup
      - --init-projections
      - --masterkeyFromEnv
      - --config
      - /zitadel.yaml
      - --steps
      - /zitadel.yaml
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Zitadel configuration
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNALDOMAIN:-zitadel-127.0.0.1.sslip.io}
      ZITADEL_EXTERNALPORT: ${HTTP_PORT:-443}
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE:-true}
      ZITADEL_TLS_ENABLED: ${ZITADEL_TLS_ENABLED:-false}
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: true
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false
      ZITADEL_SYSTEMAPIUSERS: >
        {
          "system-test-user": {
            "Path": "/system-test-user.pub"
          }
        }
      # Database configuration
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel_db
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel_db_user
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel_db_password
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
    healthcheck:
      test: [ "CMD", "/app/zitadel", "ready" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    ports: !reset null
    volumes:
      - ./zitadel-config/system-test-user.pub:/system-test-user.pub:ro
