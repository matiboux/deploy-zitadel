# Services definition override for development

services:

  # Database
  db:
    # Extend
    extends:
      file: docker-compose-db.yml
      service: db

  # Zitadel
  zitadel:
    # Deploy override
    command:
      - start-from-init
      - --masterkeyFromEnv
      - --tlsMode
      - disabled
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Zitadel configuration
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNALDOMAIN:-zitadel.localhost}
      ZITADEL_EXTERNALPORT: ${HTTP_PORT:-8080}
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE:-false}
      ZITADEL_TLS_ENABLED: ${ZITADEL_TLS_ENABLED:-false}
      ZITADEL_SYSTEMAPIUSERS: >
        {
          "system-test-user": {
            "Path": "/system-test-user.pub"
          }
        }
      # Database configuration
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel_db
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel_db_user
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel_db_password
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
    ports: !reset null
    ports:
      # HTTP
      - ${HTTP_PORT:-8080}:${DOCKER_PORT:-8080}
    volumes:
      - ./zitadel-config/system-test-user.pub:/system-test-user.pub:ro
