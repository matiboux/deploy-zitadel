# Services definition for building & deploying

services:

  # Zitadel Init
  zitadel-init:
    # Build
    image: ${ZITADEL_IMAGE:-ghcr.io/zitadel/zitadel:latest}
    # Deploy
    user: ${USER_ID:-1000}
    command:
      - init
      - --config
      - /zitadel.yaml
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Zitadel configuration
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNALDOMAIN:-zitadel.localhost}
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: ${ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED:-true}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: ${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED:-false}
      # Database configuration
      ZITADEL_DATABASE_POSTGRES_HOST: ${DB_HOST:-localhost}
      ZITADEL_DATABASE_POSTGRES_PORT: ${DB_PORT:-5432}
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${DB_NAME:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${DB_USER:-zitadel_user}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${DB_PASSWORD:-zitadel_password}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: ${DB_SSL_MODE:-require}
      # Database init configuration
      ZITADEL_DATABASE_POSTGRES_ADMIN_EXISTINGDATABASE: ${DB_ADMIN_NAME:-}
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${DB_ADMIN_USER:-postgres}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-postgres_password}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: ${DB_ADMIN_SSL_MODE:-require}

  # Zitadel
  zitadel:
    # Build
    image: ${ZITADEL_IMAGE:-ghcr.io/zitadel/zitadel:latest}
    # Deploy
    depends_on:
      zitadel-init:
        condition: service_completed_successfully
    user: ${USER_ID:-1000}
    command:
      - start-from-init
      - --masterkeyFromEnv
    environment:
      # Zitadel configuration
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}
      ZITADEL_PORT: '8080'
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNALDOMAIN:-zitadel-127.0.0.1.sslip.io}
      ZITADEL_EXTERNALPORT: ${HTTP_PORT:-443}
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE:-true}
      ZITADEL_TLS_ENABLED: ${ZITADEL_TLS_ENABLED:-false}
      # Zitadel system admin configuration
      ZITADEL_SYSTEMAPIUSERS: ${ZITADEL_SYSTEMAPIUSERS:-}
      # Database configuration
      ZITADEL_DATABASE_POSTGRES_HOST: ${DB_HOST:-localhost}
      ZITADEL_DATABASE_POSTGRES_PORT: ${DB_PORT:-5432}
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${DB_NAME:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${DB_USER:-zitadel_user}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${DB_PASSWORD:-zitadel_password}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: ${DB_SSL_MODE:-require}
      # Database init configuration
      ZITADEL_DATABASE_POSTGRES_ADMIN_EXISTINGDATABASE: ${DB_ADMIN_NAME:-}
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${DB_ADMIN_USER:-postgres}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-postgres_password}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: ${DB_ADMIN_SSL_MODE:-require}

  # Caddy Proxy
  proxy:
    # Build
    image: caddy:latest
    # Deploy
    depends_on:
      zitadel:
        condition: service_healthy
    volumes:
      - ./caddy-config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-config/zitadel/selfsigned.crt:/etc/certs/zitadel/selfsigned.crt:ro
      - ./caddy-config/zitadel/selfsigned.key:/etc/certs/zitadel/selfsigned.key:ro
      - ./caddy-config/alpha/selfsigned.crt:/etc/certs/alpha/selfsigned.crt:ro
      - ./caddy-config/alpha/selfsigned.key:/etc/certs/alpha/selfsigned.key:ro
      - ./caddy-config/beta/selfsigned.crt:/etc/certs/beta/selfsigned.crt:ro
      - ./caddy-config/beta/selfsigned.key:/etc/certs/beta/selfsigned.key:ro
    ports:
      - ${HTTP_PORT:-443}:443 # HTTPS
